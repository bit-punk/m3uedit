# Release Drafter keeps a draft of the next release (GitHub: Releases) up to date: every pull request merged into
# develop is added to the draft, sorted into the categories below by its labels. Publishing the draft creates the
# release and its tag; the next draft starts empty again.
# https://github.com/release-drafter/release-drafter (configuration format of v7)
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  # a feature raises the minor version, everything else the patch version ("major" has to be set by hand)
  - title: '🚀 Features'
    semver-increment: 'minor'
    when:
      labels:
        - 'feature'
        - 'enhancement'
  - title: '🐛 Bug Fixes'
    when:
      labels:
        - 'fix'
        - 'bugfix'
        - 'bug'
  - title: '🧰 Maintenance'
    when:
      labels:
        - 'chore'
        - 'documentation'
  - title: '📦 Dependencies'
    # the many version bumps would hide the other changes
    collapse-after: 3
    when:
      label: 'dependencies'
  # pull requests without one of the labels above
  - title: '📝 Other Changes'
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      label: 'major'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      label: 'minor'
  - type: 'version-resolver'
    semver-increment: 'patch'
change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
# labels pull requests by the name of their branch (dependabot labels its pull requests itself),
# used by the workflow .github/workflows/autolabeler.yml
autolabeler:
  - labels: [ 'feature' ]
    branch:
      - '/^feature\/.+/'
  - labels: [ 'bug' ]
    branch:
      - '/^(fix|bugfix|hotfix)\/.+/'
  - labels: [ 'chore' ]
    branch:
      - '/^(chore|cleanup)\/.+/'
template: |
  ## Changes

  $CHANGES
