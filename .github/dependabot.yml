# Keeps the dependencies up to date, see
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    # one pull request per group instead of one per dependency; major updates of libraries still get their own
    # pull request, as they may need changes of the code
    groups:
      maven-build:
        patterns:
          - "org.apache.maven:*"
          - "org.apache.maven.plugins:*"
          - "*:*-maven-plugin"
      libraries:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # JavaFX follows the LTS releases of the JDK (currently 25), the releases in between are skipped; updates
      # within the release (e.g. 25.0.x) are still proposed
      - dependency-name: "org.openjfx:*"
        update-types:
          - "version-update:semver-major"

  # the actions used by the workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
