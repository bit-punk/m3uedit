name: Release Drafter

# updates the draft of the next release with the pull requests merged into develop (.github/release-drafter.yml)
on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update_release_draft:
    permissions:
      # to create and update the draft release
      contents: write
      # to read the merged pull requests
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
