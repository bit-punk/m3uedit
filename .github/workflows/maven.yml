name: Java CI with Maven

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a new push to a pull request replaces its running build; builds of develop are all completed
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      # the maven wrapper ensures the same maven version as in local builds
      run: xvfb-run --auto-servernum ./mvnw -B --no-transfer-progress package
    - name: Upload test reports
      # shows which test failed and why
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: target/surefire-reports/
        retention-days: 7
