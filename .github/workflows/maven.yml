name: Java CI with Maven

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a new push to a pull request replaces its running build; builds of develop are all completed
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      # the maven wrapper ensures the same maven version as in local builds; install, so the plugin template can be
      # built against the plugin API of this build
      run: xvfb-run --auto-servernum ./mvnw -B --no-transfer-progress install
    - name: Build the plugin template
      # the template is a project of its own (not a module), built against the plugin API of this build like a plugin
      # of another party against a release; its manifest must declare the version of the API (PluginApi.VERSION)
      run: |
        version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
        api=$(grep -oP 'int VERSION = \K\d+' m3uedit-plugin-api/src/main/java/org/bitpunk/m3uedit/api/PluginApi.java)
        declared=$(grep -oP '<m3uedit.plugin-api>\K\d+' m3uedit-plugin-template/pom.xml)
        if [ "$api" != "$declared" ]; then
          echo "::error file=m3uedit-plugin-template/pom.xml::m3uedit.plugin-api is $declared, PluginApi.VERSION is $api"
          exit 1
        fi
        ./mvnw -B --no-transfer-progress -f m3uedit-plugin-template/pom.xml verify -Dm3uedit.version="$version"
    - name: Upload test reports
      # shows which test failed and why
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        # of all modules
        path: '**/target/surefire-reports/'
        retention-days: 7
